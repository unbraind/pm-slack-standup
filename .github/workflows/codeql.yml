name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly CodeQL scan, minute/hour staggered across the pm fleet so the
    # repos do not all fire against the API at the same time.
    - cron: "19 4 * * 1"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8 (init)
        with:
          languages: javascript-typescript
          # These packages are analyzed from source without a compiled build.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8 (analyze)
        with:
          category: "/language:javascript-typescript"
